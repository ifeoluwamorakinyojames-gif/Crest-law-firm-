name: Crest Crown — Activate password admin on Cloudflare
# Manual deployment only. Requires owner's Cloudflare and GitHub secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-admin:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: admin-staging
    steps:
      - uses: actions/checkout@v4

      - name: Check secure backend tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run password and session tests
        run: node --test worker/tests/auth.test.mjs

      - name: Verify owner-supplied Cloudflare and GitHub settings
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          CONTENT_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          INITIAL_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          names = ['CF_API_TOKEN','CF_ACCOUNT_ID','CF_KV_ID','CONTENT_TOKEN','INITIAL_PASSWORD']
          if any(not os.environ.get(n) for n in names):
              raise SystemExit('Missing required admin-staging secrets. Nothing has been deployed.')
          if not re.fullmatch(r'[a-fA-F0-9]{32}', os.environ['CF_KV_ID']):
              raise SystemExit('Invalid Cloudflare KV namespace ID.')
          if len(os.environ['INITIAL_PASSWORD']) < 20:
              raise SystemExit('The initial password must be a privately created random secret of 20+ characters.')
          config = (
              'name = "crest-crown-password-admin"\n'
              'main = "src/index.js"\n'
              'compatibility_date = "2026-10-01"\n'
              'workers_dev = true\n\n'
              '[vars]\n'
              'GITHUB_OWNER = "ifeoluwamorakinyojames-gif"\n'
              'GITHUB_REPO = "Crest-law-firm-"\n'
              'GITHUB_BRANCH = "develop"\n\n'
              '[[kv_namespaces]]\n'
              'binding = "ADMIN_KV"\n'
              f'id = "{os.environ["CF_KV_ID"]}"\n'
          )
          Path('worker/wrangler.toml').write_text(config, encoding='utf-8')
          print('Cloudflare admin deployment configuration validated.')
          PY

      - name: Deploy password-only admin Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          secrets: |
            GITHUB_TOKEN
            BOOTSTRAP_ADMIN_PASSWORD
        env:
          GITHUB_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
