name: Crest Crown — GitHub Pages staging preview

# GitHub is the single source of truth. Only reviewed changes merged into
# develop publish a staging preview. This workflow never touches a custom domain.
on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: crest-crown-github-pages-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout reviewed GitHub source
        uses: actions/checkout@v4

      - name: Validate static website
        run: |
          python3 scripts/check_site.py
          python3 scripts/check_admin.py
          node --check script.js
          node --check content-loader.js

      - name: Package single-page website
        run: |
          mkdir -p _site
          cp index.html styles.css script.js content-loader.js _site/
          cp -R content admin _site/
          if [ -d media ]; then cp -R media _site/; fi
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy staging preview (GitHub Pages only)
        id: deployment
        uses: actions/deploy-pages@v4
